<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>sircas.dk</title>
    <link rel="shortcut icon" href="https://sircas.dk/favicon.ico">
    <link rel="icon" href="https://sircas.dk/favicon.ico">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        body {
            color: #fff;

            font-family: "Helvetica Neue", "Helvetica", Helvetica, Arial, sans-serif;
            font-size: 16px;
            background-color: #AC0234; /* Pantone 194C */

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 9rem;
            font-weight: bold;
            margin: 0;
            padding: 0;
        }

        footer {
            font-size: 0.75rem;
            text-align: center;
            bottom: 2em;
            width: 100%;
            position: fixed;
        }


        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media only screen and (max-width: 700px) {
            h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="column">
            <h1>Hello</h1>
        </div>
    </main>
    <footer>
        <div>sircas.dk &copy; 2026</div>
    </footer>
</body>

</html>
